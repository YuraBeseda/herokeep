<div class="pack-trust-dialog" *transloco="let t; read: 'packs'">
  <h2 class="pack-trust-dialog__title" data-dialog-title>
    {{ t('trust.title', { name: preview.pack.name }) }}
  </h2>
  <p class="pack-trust-dialog__intro">{{ t('trust.intro') }}</p>

  <div class="pack-trust-dialog__body">
    <app-pack-info
      [pack]="preview.pack"
      [summary]="preview.summary"
      [diagnostics]="preview.diagnostics"
    />
  </div>

  @if (block(); as reason) {
    <p class="pack-trust-dialog__reason" [id]="reasonId">
      @if (reason.key === 'trust.has-errors') {
        {{ t(reason.key, { message: reason.message }) }}
      } @else {
        {{ t(reason.key) }}
      }
    </p>
  }

  <div class="pack-trust-dialog__actions">
    <button
      hk-button
      [variant]="'ghost'"
      type="button"
      class="pack-trust-dialog__cancel"
      (click)="cancel()"
    >
      {{ t('trust.cancel') }}
    </button>
    <button
      hk-button
      [variant]="'primary'"
      type="button"
      class="pack-trust-dialog__install"
      [disabled]="block() !== undefined || installing()"
      [attr.aria-describedby]="block() ? reasonId : null"
      (click)="install()"
    >
      {{ t('trust.install') }}
    </button>
  </div>
</div>
