<div class="hb-form-layout" *transloco="let t; read: 'packs'">
  <hk-leaf class="hb-form__leaf" [title]="t('homebrew.sections.species')" [icon]="'ui:heroes'">
    <form class="hb-form" novalidate (submit)="$event.preventDefault(); requestSubmit()">
      <p class="hb-form__required-note">{{ t('homebrew.required-note') }}</p>

      <div class="hb-form__grid">
        <hk-text-field
          class="hb-form__name hb-form__span"
          [label]="t('homebrew.field.name')"
          [required]="true"
          [maxLength]="200"
          [(value)]="name"
          [error]="err(t, 'name')"
          [hint]="newId() ? t('homebrew.field.id-hint', { id: newId() }) : null"
        />

        <div class="hb-form__triple hb-form__span">
          <hk-select
            class="hb-form__size"
            [label]="t('homebrew.field.species.size')"
            [options]="sizeOptions()"
            [value]="size()"
            (valueChange)="size.set($event ?? '')"
            [error]="err(t, 'size')"
          />
          <hk-number-field
            class="hb-form__speed"
            [label]="t('homebrew.field.species.speed')"
            [variant]="'leaf'"
            [min]="0"
            [step]="5"
            [(value)]="speed"
            [error]="err(t, 'speed')"
          />
          <hk-select
            class="hb-form__creature-type"
            [label]="t('homebrew.field.species.creature-type')"
            [options]="creatureTypeOptions()"
            [value]="creatureType()"
            (valueChange)="creatureType.set($event ?? '')"
            [error]="err(t, 'creatureType')"
          />
        </div>

        <fieldset class="hb-form__group hb-form__span">
          <legend>{{ t('homebrew.field.species.traits') }}</legend>
          @for (row of traits(); track $index; let i = $index) {
            <div class="hb-form__trait">
              <hk-text-field
                class="hb-form__trait-name"
                [label]="t('homebrew.field.species.trait-name')"
                [maxLength]="200"
                [value]="row.name"
                (valueChange)="setTrait(i, { name: $event })"
              />
              <hk-textarea
                class="hb-form__trait-text"
                [label]="t('homebrew.field.species.trait-text')"
                [rows]="3"
                [value]="row.text"
                (valueChange)="setTrait(i, { text: $event })"
                [error]="err(t, 'trait-' + i)"
              />
              <div class="hb-form__actions">
                <button
                  hk-button
                  type="button"
                  [variant]="'ghost'"
                  class="hb-form__remove-trait"
                  (click)="removeTrait(i)"
                >
                  <hk-icon [icon]="'ui:remove'" />{{ t('homebrew.field.species.remove-trait') }}
                </button>
              </div>
            </div>
          }
          <div>
            <button
              hk-button
              type="button"
              [variant]="'parchment'"
              class="hb-form__add-trait"
              (click)="addTrait()"
            >
              <hk-icon [icon]="'ui:add'" />{{ t('homebrew.field.species.add-trait') }}
            </button>
          </div>
        </fieldset>

        <hk-textarea
          class="hb-form__description hb-form__span"
          [label]="t('homebrew.field.description')"
          [rows]="6"
          [(value)]="description"
        />
      </div>
    </form>
  </hk-leaf>

  <div class="hb-form__side">
    <hk-leaf class="hb-form__tips" [title]="t('homebrew.saving.title')" [icon]="'ui:save'">
      <ul class="hb-form__tip-list">
        <li>{{ t('homebrew.saving.bump') }}</li>
        <li>{{ t('homebrew.saving.validated') }}</li>
        <li>{{ t('homebrew.saving.names') }}</li>
      </ul>
    </hk-leaf>
  </div>
</div>
