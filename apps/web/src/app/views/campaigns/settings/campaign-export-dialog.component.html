<ng-container *transloco="let t; read: 'campaigns'">
  <h2 class="campaign-export-dialog__title" data-dialog-title>{{ t('export.title') }}</h2>

  <p class="campaign-export-dialog__body">{{ t('export.body') }}</p>

  <div class="campaign-export-dialog__actions">
    <button
      hk-button
      type="button"
      class="campaign-export-dialog__cancel"
      [variant]="'ghost'"
      [disabled]="exporting()"
      (click)="cancel()"
    >
      {{ t('export.cancel') }}
    </button>
    <button
      hk-button
      type="button"
      class="campaign-export-dialog__confirm"
      [variant]="'primary'"
      [disabled]="exporting()"
      (click)="onExport(t)"
    >
      {{ exporting() ? t('export.exporting') : t('export.confirm') }}
    </button>
  </div>
</ng-container>
