<section class="join" *transloco="let t; read: 'campaigns'">
  <h1 class="join__title">{{ t('join.title') }}</h1>
  <p class="join__intro">{{ t('join.intro') }}</p>

  <form class="join__form" novalidate (submit)="$event.preventDefault(); confirm()">
    <hk-text-field
      class="join__code"
      [label]="t('join.codeLabel')"
      [value]="code()"
      [hint]="t('join.codeHint')"
      [autocomplete]="'off'"
      (valueChange)="onCodeChange($event)"
    />

    <hk-text-field
      class="join__display-name"
      [label]="t('join.displayNameLabel')"
      [value]="displayName()"
      [autocomplete]="'off'"
      (valueChange)="onDisplayNameChange($event)"
    />

    @if (errorKey(); as key) {
      <p class="join__error" role="alert">{{ t(key) }}</p>
    }

    <div class="join__actions">
      <a routerLink="/campaigns" class="join__back">{{ t('join.back') }}</a>
      <button
        hk-button
        type="submit"
        class="join__confirm"
        [variant]="'primary'"
        [loading]="submitting()"
        [disabled]="!canSubmit()"
      >
        {{ submitting() ? t('join.joining') : t('join.confirm') }}
      </button>
    </div>
  </form>
</section>
