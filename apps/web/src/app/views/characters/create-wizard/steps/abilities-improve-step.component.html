<div class="abilities-improve-step" *transloco="let t; read: 'characters'">
  @if (info(); as info) {
    <ul class="abilities-improve-step__slots">
      @for (delta of info.deltas; track $index; let slot = $index) {
        <li class="abilities-improve-step__slot">
          <hk-tag-chip
            class="abilities-improve-step__slot-label"
            [tone]="'warning'"
            [label]="t('wizard.abilitiesImprove.deltaLabel', { delta: delta })"
          />
          <div class="abilities-improve-step__chips">
            @for (a of optionsForSlot(slot); track a.id) {
              <!-- eslint-disable-next-line @angular-eslint/template/elements-content -- the chip renders its own label -->
              <button
                hk-filter-chip
                type="button"
                [option]="chipOption(a.id, t('wizard.abilitiesImprove.locked'))"
                [pressed]="isAssigned(slot, a.id)"
                [class.abilities-improve-step__chip--disabled]="disabled()"
                (click)="onSelectSlot(slot, a.id)"
              ></button>
            }
          </div>
        </li>
      }
    </ul>
  }

  @if (diagnostics().length > 0) {
    <ul class="abilities-improve-step__diagnostics">
      @for (d of diagnostics(); track $index) {
        <li
          class="abilities-improve-step__diagnostic"
          [class.abilities-improve-step__diagnostic--error]="d.severity === 'error'"
        >
          {{ t(diagnosticKey(d.code)) }}
        </li>
      }
    </ul>
  }
</div>
