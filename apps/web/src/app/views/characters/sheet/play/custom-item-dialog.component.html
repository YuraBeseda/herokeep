<ng-container *transloco="let t">
  <h2 class="custom-item-dialog__title" data-dialog-title>
    {{ t('characters.sheet.inventory.customDialog.title') }}
  </h2>

  <div class="custom-item-dialog__fields">
    <!-- The icon field arrives with plan slice 2; the slot is left empty on purpose. -->
    <hk-text-field
      [label]="t('characters.sheet.inventory.customDialog.nameLabel')"
      [maxLength]="200"
      [required]="true"
      [error]="
        nameTouched() && nameBlank()
          ? t('characters.sheet.inventory.customDialog.nameRequired')
          : null
      "
      [value]="name()"
      (valueChange)="name.set($event); nameTouched.set(true)"
    />
    <hk-textarea
      [label]="t('characters.sheet.inventory.customDialog.notesLabel')"
      [rows]="3"
      [(value)]="notes"
    />
  </div>

  <div class="custom-item-dialog__actions" data-dialog-actions>
    <button hk-button type="button" [variant]="'ghost-leather'" (click)="cancel()">
      {{ t('characters.sheet.inventory.customDialog.cancel') }}
    </button>
    <hk-number-field
      class="custom-item-dialog__qty"
      [label]="t('characters.sheet.inventory.customDialog.qtyLabel')"
      [min]="1"
      [step]="1"
      [(value)]="qty"
    />
    <button hk-button type="button" [disabled]="nameBlank()" (click)="confirm()">
      {{ t('characters.sheet.inventory.customDialog.confirm') }}
    </button>
  </div>
</ng-container>
