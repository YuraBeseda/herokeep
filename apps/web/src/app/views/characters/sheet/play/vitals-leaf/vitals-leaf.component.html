@if (sheet(); as s) {
  <ng-container *transloco="let t; read: 'characters'">
    <fieldset class="vitals__hp" [disabled]="actions.editLocked()">
      <legend class="visually-hidden">{{ t('sheet.hp.title') }}</legend>
      <hk-hp-gauge
        [current]="s.hp.current"
        [max]="s.hp.max.value"
        [temp]="s.hp.temp"
        [tempHint]="t('sheet.explain.temporaryHp')"
        (damage)="actions.damage($event)"
        (heal)="actions.heal($event)"
        (setTemp)="actions.addTemp($event)"
      />
    </fieldset>

    <section class="vitals__stats" [attr.aria-label]="t('sheet.vitals.title')">
      <hk-shield-badge
        class="vitals__ac"
        hkDerived
        [hkDerivedBreakdown]="s.ac"
        [value]="s.ac.value"
        [size]="compact() ? 's' : 'm'"
        [hint]="t('sheet.stats.acHint', { value: s.ac.value })"
        [explain]="t('sheet.explain.armorClass')"
      />
      <hk-stat-tile
        class="vitals__initiative"
        hkDerived
        [hkDerivedBreakdown]="s.initiative"
        [label]="t('sheet.stats.initiative')"
        [value]="signed(s.initiative.value)"
        [icon]="'ui:initiative'"
        [hint]="hintWith(t('sheet.explain.initiative'), s.initiative, t)"
      />
      @for (speed of speedRows(); track speed.mode) {
        <hk-stat-tile
          class="vitals__speed"
          hkDerived
          [hkDerivedBreakdown]="speed.value"
          [label]="t('sheet.stats.speed')"
          [value]="speed.value.value"
          [icon]="'ui:speed'"
          [hint]="hintWith(t('sheet.explain.speed'), speed.value, t)"
        />
      }
    </section>

    <section class="vitals__extras" [attr.aria-label]="t('sheet.vitals.extras')">
      <hk-stat-tile
        class="vitals__max"
        hkDerived
        [hkDerivedBreakdown]="s.hp.max"
        [label]="t('sheet.hp.max')"
        [value]="s.hp.max.value"
        [icon]="'ui:hp'"
      />
      <hk-stat-tile
        class="vitals__prof"
        [label]="t('sheet.stats.prof')"
        [value]="signed(s.prof)"
        [icon]="'ui:proficiency'"
        [hint]="t('sheet.explain.proficiencyBonus')"
      />
      <hk-stat-tile
        class="vitals__passive"
        [label]="t('sheet.stats.passivePerception')"
        [value]="s.passivePerception"
        [hint]="t('sheet.explain.passivePerception')"
      />
      @if (hitDiceRows().length > 0) {
        <hk-stat-tile
          class="vitals__hit-dice"
          [label]="t('sheet.hp.hitDice')"
          [value]="hitDiceText()"
          [hint]="t('sheet.explain.hitDice')"
        />
      }
    </section>
  </ng-container>
}
