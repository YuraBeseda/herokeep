<ng-container *transloco="let t">
  <h2 class="add-item-dialog__title" data-dialog-title>
    {{ t('characters.sheet.inventory.addDialog.title') }}
  </h2>

  <hk-entity-picker
    [ids]="itemIds()"
    [limit]="itemPickerLimit"
    [layout]="'rows'"
    [showItemDetails]="true"
    (toggled)="onPick($event)"
  />

  <div class="add-item-dialog__actions" data-dialog-actions>
    <button hk-button type="button" [variant]="'ghost-leather'" (click)="cancel()">
      {{ t('characters.sheet.inventory.addDialog.cancel') }}
    </button>
    <hk-number-field
      class="add-item-dialog__qty"
      [label]="t('characters.sheet.inventory.addDialog.qtyLabel')"
      [min]="1"
      [step]="1"
      [(value)]="qty"
    />
  </div>
</ng-container>
