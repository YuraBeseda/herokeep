<ng-container *transloco="let t; read: 'characters'">
  @if (sheet(); as s) {
    <ng-template #body>
      <ul class="skills">
        @for (skill of rows(); track skill.id) {
          <li>
            <hk-skill-row
              [name]="skill.label"
              [modifier]="skill.total"
              [proficiency]="skill.proficiency"
              [proficiencyHint]="t(skill.hintKey)"
              [density]="phone() ? 'comfortable' : 'compact'"
              [surface]="surface()"
              [inspectable]="true"
              (inspect)="openBreakdown(skill.totalDerived)"
              (roll)="roll(skill, t)"
            />
          </li>
        }
      </ul>
    </ng-template>
    <ng-template #chips>
      <hk-tag-chip [label]="t('sheet.skills.passive', { value: s.passivePerception })" />
      <hk-tag-chip [label]="t('sheet.skills.prof', { value: signed(s.prof) })" />
    </ng-template>
    @if (surface() === 'leather') {
      <section class="skills__panel">
        <h2 class="skills__title">
          <hk-icon [icon]="'ui:proficiency'" />{{ t('sheet.skills.title') }}
        </h2>
        <ng-container *ngTemplateOutlet="body" />
      </section>
    } @else {
      <hk-leaf [title]="t('sheet.skills.title')" [icon]="'ui:proficiency'" [phone]="phone()">
        @if (showPassive()) {
          <span hkLeafActions><ng-container *ngTemplateOutlet="chips" /></span>
        }
        <ng-container *ngTemplateOutlet="body" />
      </hk-leaf>
    }
  }
</ng-container>
