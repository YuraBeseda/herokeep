@if (sheet(); as s) {
  <div class="build-tab" *transloco="let t; read: 'characters'">
    <!-- Campaign edit lock (plan-10 task-14-brief.md, ruling 7): the identical embed the Play
         leaves use; this component's own class doc explains the design. -->
    <app-campaign-edit-lock-banner [mode]="editLock().mode" />

    <hk-leaf
      class="build-tab__outstanding"
      [icon]="'ui:spells'"
      [title]="
        outstanding().length > 0
          ? t('sheet.build.outstanding.banner', { count: outstanding().length })
          : t('sheet.build.outstanding.title')
      "
    >
      @if (outstanding().length > 0) {
        <!-- hk-choice-step carries its OWN disabled input: the AUTHORITATIVE gate (its toggle,
             add-literal, remove-literal and slot handlers all no-op while true). The wrapping
             fieldset stays: it blocks the real buttons of the query/static/literal branches per
             the HTML spec, but is cosmetic only for the skills/abilities branches' chip clicks (a
             custom element is never a listed form-associated element). -->
        <fieldset
          class="build-tab__outstanding-list build-tab__outstanding-fieldset"
          [disabled]="editLocked()"
        >
          @for (req of outstanding(); track req.choiceId) {
            <div class="build-tab__outstanding-item">
              <hk-choice-step
                [choiceId]="req.choiceId"
                [sheet]="s"
                [validate]="validateChoice"
                [commit]="commitChoice"
                [disabled]="editLocked()"
              />
            </div>
          }
        </fieldset>
      } @else {
        <p class="build-tab__empty">{{ t('sheet.build.outstanding.empty') }}</p>
      }
    </hk-leaf>

    <div class="build-tab__columns">
      <div class="build-tab__column">
        <app-build-origin-section />
        <app-build-abilities-section />
        <app-build-choices-section
          [disabled]="editLocked()"
          [disabledReason]="editLocked() ? t('sheet.editLocked') : null"
          [validate]="validateChoice"
          [commit]="commitChoice"
        />
      </div>
      <div class="build-tab__column">
        <app-build-proficiencies-section />
        <app-build-options-section [disabled]="editLocked()" />
        <app-build-packs-section [disabled]="editLocked()" />
        <app-build-identity-section
          [disabled]="editLocked()"
          [disabledReason]="editLocked() ? t('sheet.editLocked') : null"
        />
      </div>
    </div>
  </div>
}
