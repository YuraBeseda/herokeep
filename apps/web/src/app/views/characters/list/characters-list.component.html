<section class="characters-list" *transloco="let t; read: 'characters'">
  <header class="characters-list__header">
    <h1 class="characters-list__title">{{ t('list.title') }}</h1>
    @if (!loading() && rows().length > 0) {
      <p class="characters-list__count">{{ t('list.count', { count: rows().length }) }}</p>
    }
  </header>

  <input
    #importInput
    type="file"
    class="characters-list__import-input"
    hidden
    [disabled]="importing()"
    [attr.accept]="importAccept"
    (change)="onImportFileSelected($event)"
  />

  <app-install-banner />

  @if (loading()) {
    <div class="characters-list__skeletons" [attr.aria-label]="t('list.loading')">
      @for (row of skeletonRows; track row) {
        <hk-skeleton width="100%" />
      }
    </div>
  } @else if (rows().length === 0) {
    <hk-leaf class="characters-list__empty" [title]="t('list.emptyTitle')" [icon]="'ui:heroes'">
      <p class="characters-list__empty-body">{{ t('list.empty') }}</p>
    </hk-leaf>
  } @else {
    <ul class="characters-list__grid" [attr.aria-label]="t('list.landmark')">
      @for (row of rows(); track row.id) {
        <li class="characters-list__item">
          <app-hero-card
            [row]="row"
            [summary]="summaries().get(row.id)"
            [sync]="syncByRow().get(row.id) ?? null"
            [menu]="true"
            [busy]="importing()"
            (opened)="open(row.id)"
            (deleteRequested)="delete(row)"
          />
        </li>
      }
    </ul>
  }
</section>
