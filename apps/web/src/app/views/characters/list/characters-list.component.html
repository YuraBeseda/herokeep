<section class="characters-list" *transloco="let t; read: 'characters'">
  <div class="characters-list__header">
    <h1 class="characters-list__title">{{ t('list.title') }}</h1>
    <div class="characters-list__actions">
      <button
        hk-button
        [variant]="'ghost'"
        type="button"
        class="characters-list__import"
        [disabled]="importing()"
        (click)="onImportClick()"
      >
        {{ t('list.import') }}
      </button>
      <input
        #importInput
        type="file"
        class="characters-list__import-input"
        hidden
        [disabled]="importing()"
        [attr.accept]="importAccept"
        (change)="onImportFileSelected($event)"
      />
      <button
        hk-button
        [variant]="'primary'"
        type="button"
        class="characters-list__create"
        (click)="create()"
      >
        {{ t('list.create') }}
      </button>
    </div>
  </div>

  <app-install-banner />

  @if (loading()) {
    <div class="characters-list__skeletons">
      @for (row of skeletonRows; track row) {
        <hk-skeleton width="100%" />
      }
    </div>
  } @else if (rows().length === 0) {
    <p class="characters-list__empty">{{ t('list.empty') }}</p>
  } @else {
    <div class="characters-list__grid" [attr.aria-label]="t('list.landmark')">
      @for (row of rows(); track row.id) {
        <hk-card class="characters-list__item">
          <button type="button" class="characters-list__open" (click)="open(row.id)">
            @if ((row.portraitThumbHash | blobUrl)(); as thumbUrl) {
              <img
                class="characters-list__portrait"
                [src]="thumbUrl"
                [alt]="t('sheet.portrait.alt', { name: row.name })"
              />
            } @else {
              <div
                class="characters-list__portrait characters-list__portrait--placeholder"
                [style.background]="monogramBackground(row)"
                aria-hidden="true"
              >
                {{ monogramInitials(row) }}
              </div>
            }
            <span class="characters-list__name">{{ row.name }}</span>
            <span class="characters-list__meta">{{ row.system }}</span>
            @if (authService.status() === 'authed') {
              <span
                class="characters-list__sync-badge"
                role="img"
                [attr.data-sync-state]="syncStateBucket(row.id)"
                [attr.aria-label]="t(syncTooltipKey(row.id), { count: syncPendingCount(row.id) })"
                [title]="t(syncTooltipKey(row.id), { count: syncPendingCount(row.id) })"
              >
                @if (syncStateBucket(row.id) === 'pending') {
                  <span class="characters-list__sync-badge-count" aria-hidden="true">{{
                    syncPendingCount(row.id)
                  }}</span>
                }
              </span>
            }
          </button>
          <button
            hk-button
            [variant]="'danger'"
            type="button"
            class="characters-list__delete"
            [disabled]="importing()"
            (click)="delete(row)"
          >
            {{ t('list.delete') }}
          </button>
        </hk-card>
      }
    </div>
  }
</section>
