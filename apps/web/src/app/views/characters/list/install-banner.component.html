@if (visible()) {
  <ng-container *transloco="let t; read: 'characters'">
    <hk-banner
      class="install-banner"
      [variant]="'info'"
      [dismissable]="true"
      (dismissed)="onDismiss()"
    >
      <span class="install-banner__text">{{ t('list.installBanner.text') }}</span>
      @if (canInstall()) {
        <button
          hkBannerActions
          hk-button
          type="button"
          class="install-banner__install"
          (click)="onInstallClick()"
        >
          {{ t('list.installBanner.install') }}
        </button>
      } @else if (showIosHint()) {
        <button
          hkBannerActions
          hk-button
          type="button"
          [variant]="'ghost'"
          class="install-banner__ios"
          (click)="onShowIosInstructions()"
        >
          {{ t('list.installBanner.howToInstall') }}
        </button>
      }
    </hk-banner>
  </ng-container>
}
