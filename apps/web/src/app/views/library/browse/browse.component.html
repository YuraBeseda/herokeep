<section class="library-browse" *transloco="let t; read: 'library'">
  <header class="library-browse__header">
    <h1 class="library-browse__title">{{ t('title') }}</h1>
    <p class="library-browse__subtitle">{{ t('subtitle') }}</p>
  </header>

  <hk-leaf class="library-browse__leaf" [title]="t('browse.leaf')" [icon]="'ui:library'">
    <div class="library-browse__tools">
      <hk-search-field
        class="library-browse__search"
        [value]="query()"
        (valueChange)="setQuery($event)"
        [label]="t('search.label')"
        [placeholder]="t('search.placeholder')"
      />
      <span class="library-browse__hint">{{ t('search.hint') }}</span>
      <hk-select
        class="library-browse__sort"
        [label]="t('sort.label')"
        [options]="sortOptions(t)"
        [value]="sort()"
        (valueChange)="setSort($event)"
      />
    </div>

    <hk-filter-chips
      class="library-browse__filters"
      [label]="t('filter.label')"
      [options]="typeOptions(t)"
      [allLabel]="t('filter.all')"
      [allCount]="allCount()"
      [allIcon]="'ui:library'"
      [selected]="selectedTypes()"
      (selectedChange)="setTypes($event)"
    />

    @if (!ready()) {
      <div class="library-browse__skeletons">
        @for (row of skeletonRows; track row) {
          <hk-skeleton width="100%" />
        }
      </div>
    } @else {
      @if (searching()) {
        <p class="library-browse__summary" role="status">
          {{ t('search.results', { count: rows().length }) }}
        </p>
      } @else {
        <p class="library-browse__count" role="status">
          {{ t('list.count', { count: rows().length }) }}
        </p>
      }
      <hk-virtual-list
        class="library-browse__list"
        [items]="rows()"
        [itemSize]="64"
        [attr.aria-label]="t('list.label')"
      >
        <ng-template let-row>
          <button type="button" class="library-browse__row" (click)="onRowClick(row.id)">
            <span class="library-browse__row-ring" aria-hidden="true">
              <hk-icon [icon]="row.icon" class="library-browse__row-icon" />
            </span>
            <span class="library-browse__row-text">
              <span class="library-browse__row-name" data-truncate [hkTooltip]="row.name">
                @for (segment of row.segments; track $index) {
                  @if (segment.hit) {
                    <mark class="library-browse__mark">{{ segment.text }}</mark>
                  } @else {
                    <span>{{ segment.text }}</span>
                  }
                }
              </span>
              @if (row.sub.length > 0) {
                <span
                  class="library-browse__row-sub"
                  data-truncate
                  [hkTooltip]="subText(row.sub, t)"
                >
                  @for (part of row.sub; track $index; let last = $last) {
                    <app-fact-value [value]="part" />
                    @if (!last) {
                      <span aria-hidden="true"> · </span>
                    }
                  }
                </span>
              }
            </span>
            <hk-tag-chip
              class="library-browse__row-type"
              [label]="t('type.' + row.type)"
              [icon]="typeIcon(row.type)"
            />
            @if (row.fallback) {
              <hk-tag-chip class="library-browse__row-tag" [label]="t('en-tag')" [tone]="'dark'" />
            }
          </button>
        </ng-template>
      </hk-virtual-list>
    }
  </hk-leaf>
</section>
