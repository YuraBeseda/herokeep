<ng-container *transloco="let t; read: 'auth'">
  <app-auth-card class="recover" [glyph]="'ui:recover'" [sealHint]="t('recover.title')" [seed]="4">
    <h1 authTitle class="recover__title">{{ t('recover.title') }}</h1>

    <form class="recover__form" novalidate (submit)="onSubmit($event)">
      <hk-banner class="recover__notice" [variant]="'warning'" [icon]="'warning'">
        {{ t('recover.signOutNotice') }}
      </hk-banner>

      <hk-text-field
        class="recover__username"
        name="username"
        autocomplete="username"
        [label]="t('recover.usernameLabel')"
        [required]="true"
        [error]="usernameErrorKey() ? t(usernameErrorKey()!) : null"
        [value]="username()"
        (valueChange)="onUsernameInput($event)"
      />

      <hk-text-field
        class="recover__code"
        name="code"
        autocomplete="off"
        [mono]="true"
        [announce]="true"
        [label]="t('recover.codeLabel')"
        [hint]="t('recover.codeHint')"
        [required]="true"
        [error]="codeErrorKey() ? t(codeErrorKey()!) : null"
        [value]="code()"
        (valueChange)="onCodeInput($event)"
      />

      <div class="recover__password">
        <hk-text-field
          name="newPassword"
          type="password"
          autocomplete="new-password"
          [label]="t('recover.newPasswordLabel')"
          [hint]="t(passwordHintKey())"
          [required]="true"
          [error]="passwordVerdictReasonKey() ? t(passwordVerdictReasonKey()!) : null"
          [value]="newPassword()"
          (valueChange)="onPasswordInput($event)"
        />
      </div>

      @if (formErrorKey(); as key) {
        <p class="recover__error" role="alert"><hk-icon [icon]="'ui:warning'" />{{ t(key) }}</p>
      }

      <p class="recover__links">
        <a routerLink="/login">{{ t('recover.loginLink') }}</a>
      </p>

      <div data-auth-strap>
        <span class="auth-card__note">{{ t('recover.strapNote') }}</span>
        <button
          hk-button
          type="submit"
          class="recover__submit"
          [variant]="'primary'"
          [loading]="submitting()"
          [disabledReason]="canSubmit() || submitting() ? null : t('recover.reasonIncomplete')"
        >
          <hk-icon [icon]="'ui:key'" />{{
            submitting() ? t('recover.submitting') : t('recover.submit')
          }}
        </button>
      </div>
    </form>
  </app-auth-card>
</ng-container>
