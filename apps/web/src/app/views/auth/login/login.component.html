<ng-container *transloco="let t; read: 'auth'">
  <app-auth-card class="login" [glyph]="'ui:account'" [sealHint]="t('login.title')" [seed]="1">
    <h1 authTitle class="login__title">{{ t('login.title') }}</h1>

    <form class="login__form" novalidate (submit)="onSubmit($event)">
      @if (redirectSection; as section) {
        <hk-banner class="login__redirected" [variant]="'info'" [icon]="'join'">
          {{ t('login.redirected', { section }) }}
        </hk-banner>
      }

      <hk-text-field
        class="login__username"
        name="username"
        autocomplete="username"
        [label]="t('login.usernameLabel')"
        [required]="true"
        [value]="username()"
        (valueChange)="onUsernameInput($event)"
      />

      <hk-text-field
        class="login__password"
        name="password"
        type="password"
        autocomplete="current-password"
        [label]="t('login.passwordLabel')"
        [required]="true"
        [announce]="true"
        [error]="passwordErrorKey() ? t(passwordErrorKey()!) : null"
        [value]="password()"
        (valueChange)="onPasswordInput($event)"
      />

      <hk-text-field
        class="login__device"
        name="deviceLabel"
        autocomplete="off"
        [label]="t('login.deviceLabelLabel')"
        [hint]="t('login.deviceLabelHint')"
        [value]="deviceLabel()"
        (valueChange)="deviceLabel.set($event)"
      />

      @if (formErrorKey(); as key) {
        <p class="login__error" role="alert"><hk-icon [icon]="'ui:warning'" />{{ t(key) }}</p>
      }

      <p class="login__links">
        <a routerLink="/register">{{ t('login.registerLink') }}</a>
        <a routerLink="/recover">{{ t('login.recoverLink') }}</a>
      </p>

      <div data-auth-strap>
        <span class="auth-card__note">{{ t('login.strapNote') }}</span>
        <button
          hk-button
          type="submit"
          class="login__submit"
          [variant]="'primary'"
          [loading]="submitting()"
        >
          <hk-icon [icon]="'ui:join'" />{{
            submitting() ? t('login.submitting') : t('login.submit')
          }}
        </button>
      </div>
    </form>
  </app-auth-card>
</ng-container>
