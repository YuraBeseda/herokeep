<ng-container *transloco="let t; read: 'shell'">
  <button
    type="button"
    class="hk-picker-card__body"
    [attr.aria-label]="bodyLabel(t('ui.picker.details-of', { name: name() }))"
    (click)="details.emit()"
  >
    <span class="hk-picker-card__head">
      @if (icon(); as glyph) {
        <hk-icon class="hk-picker-card__glyph" [icon]="glyph" />
      }
      <span class="hk-picker-card__name">{{ name() }}</span>
    </span>
    @if (description(); as text) {
      <span class="hk-picker-card__desc">{{ text }}</span>
    }
  </button>

  @if (selected()) {
    <hk-wax-seal
      class="hk-picker-card__seal"
      [size]="'s'"
      [state]="'selected'"
      [glyph]="'ui:done'"
      [hint]="t('ui.picker.chosen')"
    />
  }

  @if (meta().length > 0) {
    <ul class="hk-picker-card__meta">
      @for (item of meta(); track item) {
        <li><hk-tag-chip [label]="item" /></li>
      }
    </ul>
  }

  @if (gated() && !selected() && reason(); as why) {
    <!-- The reason lives in the hint and the accessible name, never as text on the card. -->
    <span
      class="hk-picker-card__gate"
      role="img"
      tabindex="0"
      [id]="reasonId"
      [attr.aria-label]="why"
      [hkTooltip]="why"
    >
      <hk-icon class="hk-picker-card__gate-icon" [icon]="'ui:lock'" />
    </span>
  }

  <div class="hk-picker-card__foot">
    <button
      type="button"
      hk-button
      class="hk-picker-card__choose"
      [variant]="selected() ? 'parchment' : 'primary'"
      [attr.aria-pressed]="selected()"
      [attr.aria-label]="
        (selected() ? t('ui.picker.chosen') : t('ui.picker.choose')) + ': ' + name()
      "
      [disabledReason]="blockedReason()"
      (click)="choose.emit()"
    >
      {{ selected() ? t('ui.picker.chosen') : t('ui.picker.choose') }}
    </button>
  </div>
</ng-container>
