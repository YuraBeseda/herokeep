<ng-container *transloco="let t; read: 'shell'">
  <span
    [class]="'hk-dot hk-dot--' + proficiency()"
    role="img"
    [tabindex]="dotTabindex()"
    [attr.aria-label]="proficiencyHint()"
    [hkTooltip]="proficiencyHint()"
  ></span>
  <span class="hk-sk__name" data-truncate [id]="nameId" [hkTooltip]="name()">{{ name() }}</span>
  @if (disadvantage(); as cause) {
    <span class="hk-dis" tabindex="0" [hkTooltip]="cause">
      <hk-icon [icon]="'ui:disadvantage'" />
      {{ t('icon.disadvantage') }}
    </span>
  }
  <span
    class="hk-sk__mod"
    [attr.data-breakdown]="'total'"
    [class.hk-sk__inspect]="inspectable()"
    [hkTooltip]="modifierHint()"
    [attr.role]="inspectable() ? 'button' : null"
    [attr.tabindex]="inspectable() ? 0 : null"
    [attr.aria-label]="
      inspectable() ? t('ui.breakdown.show', { name: name(), value: modifierText() }) : null
    "
    (click)="press($event)"
    (keydown.enter)="press($event)"
    (keydown.space)="press($event)"
    >{{ modifierText() }}</span
  >
  <button
    hk-icon-button
    [icon]="'roll'"
    [hint]="'shell.icon.roll'"
    [variant]="'ghost'"
    [size]="'s'"
    [id]="rollId"
    [attr.aria-labelledby]="rollLabelledBy"
    (click)="roll.emit()"
  ></button>
</ng-container>
