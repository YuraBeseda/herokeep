<ng-container *transloco="let t; read: 'shell'">
  <hk-wax-seal
    [size]="'l'"
    [text]="modifierText()"
    [seed]="score()"
    [hint]="t('ui.ability.meter', { name: ability(), score: score(), modifier: modifierText() })"
  />
  <span class="hk-ability__name">{{ ability() }}</span>
  <span
    class="hk-ability__score"
    [attr.data-breakdown]="'score'"
    [class.hk-ability__inspect]="inspectable()"
    [attr.role]="inspectable() ? 'button' : 'group'"
    [attr.tabindex]="inspectable() ? 0 : null"
    (click)="press('score', $event)"
    (keydown.enter)="press('score', $event)"
    (keydown.space)="press('score', $event)"
    [hkTooltip]="t('ui.ability.score', { score: score() })"
    [attr.aria-label]="t('ui.ability.score', { score: score() })"
    >{{ score() }}</span
  >
  <span
    class="hk-ability__save"
    [attr.data-breakdown]="'save'"
    [class.hk-ability__save--prof]="saveProficient()"
    [class.hk-ability__inspect]="inspectable()"
    [attr.role]="inspectable() ? 'button' : 'group'"
    [attr.tabindex]="inspectable() ? 0 : null"
    (click)="press('save', $event)"
    (keydown.enter)="press('save', $event)"
    (keydown.space)="press('save', $event)"
    [hkTooltip]="t('ui.ability.save', { value: saveText() })"
    [attr.aria-label]="t('ui.ability.save', { value: saveText() })"
  >
    <hk-icon [icon]="'ui:save'" />{{ saveText() }}
    @if (saveProficient()) {
      <span
        class="hk-ability__star"
        role="img"
        [hkTooltip]="t('ui.ability.save-proficient')"
        [attr.aria-label]="t('ui.ability.save-proficient')"
      >
        <hk-icon [icon]="'gi:star'" />
      </span>
    }
  </span>
</ng-container>
