<ng-container *transloco="let t; read: 'shell'">
  @let hint = active() ? t('ui.inspiration.press-spend') : t('ui.inspiration.press-grant');
  <button
    type="button"
    class="hk-toggle"
    [attr.aria-pressed]="active()"
    [attr.aria-disabled]="disabledReason() ? 'true' : null"
    [attr.aria-label]="t('icon.inspiration')"
    [hkTooltip]="disabledReason() || (explain() ? explain() + ' ' + hint : hint)"
    (click)="press()"
  >
    <hk-icon [icon]="'ui:inspiration'" />
  </button>
</ng-container>
