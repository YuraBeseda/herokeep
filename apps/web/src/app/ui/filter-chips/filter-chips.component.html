<ng-container *transloco="let t; read: 'shell'">
  <div class="hk-filter-chips__group" role="group" [attr.aria-label]="label()">
    @for (option of options(); track option.id) {
      <!-- eslint-disable-next-line @angular-eslint/template/elements-content -- the chip component renders its own label -->
      <button
        hk-filter-chip
        [option]="option"
        [pressed]="selected().includes(option.id)"
        (click)="toggle(option)"
      ></button>
    }
    @if (selected().length > 0) {
      <button type="button" class="hk-filter-chips__clear" (click)="clear()">
        {{ t('ui.filter.clear') }}
      </button>
    }
  </div>
</ng-container>
