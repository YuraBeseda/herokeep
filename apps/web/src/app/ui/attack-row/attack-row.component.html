<ng-container *transloco="let t; read: 'shell'">
  <span class="hk-iring"><hk-icon [icon]="icon()" /></span>
  <span class="hk-arow__title">
    <span class="hk-arow__name" [hkTooltip]="name()">{{ name() }}</span>
    @if (attuned(); as hint) {
      <span
        class="hk-arow__gem"
        role="img"
        tabindex="0"
        [attr.aria-label]="hint"
        [hkTooltip]="hint"
      >
        <hk-icon [icon]="'ui:attune'" />
      </span>
    }
  </span>
  <span
    class="hk-arow__hit"
    [attr.data-breakdown]="'hit'"
    [class.hk-arow__inspect]="inspectable()"
    [attr.role]="inspectable() ? 'button' : null"
    [attr.tabindex]="inspectable() ? 0 : null"
    [attr.aria-label]="
      inspectable() ? t('ui.breakdown.hit', { name: name(), value: toHitText() }) : null
    "
    (click)="press('hit', $event)"
    (keydown.enter)="press('hit', $event)"
    (keydown.space)="press('hit', $event)"
    >{{ toHitText() }}</span
  >
  <span class="hk-arow__dmgcell">
    <span
      class="hk-arow__dmg"
      [attr.data-breakdown]="'damage'"
      [class.hk-arow__inspect]="inspectable()"
      [attr.role]="inspectable() ? 'button' : null"
      [attr.tabindex]="inspectable() ? 0 : null"
      [attr.aria-label]="
        inspectable() ? t('ui.breakdown.damage', { name: name(), value: damage() }) : null
      "
      (click)="press('damage', $event)"
      (keydown.enter)="press('damage', $event)"
      (keydown.space)="press('damage', $event)"
      >{{ damage() }}</span
    >
    @if (damageType(); as type) {
      <span class="hk-arow__type">
        <hk-tag-chip [label]="type.label" [damage]="type.damage ?? null" />
      </span>
    }
  </span>
  <hk-menu-button
    [items]="menuItems"
    [icon]="'ui:roll'"
    [label]="t('ui.attack.roll', { name: name() })"
  />
  @if (tags().length > 0) {
    <span class="hk-arow__tags">
      @for (tag of tags(); track $index) {
        <hk-tag-chip
          [label]="tag.label"
          [tone]="tag.tone ?? 'neutral'"
          [icon]="tag.icon ?? null"
          [hint]="tag.hint ?? null"
        />
      }
    </span>
  }
</ng-container>
