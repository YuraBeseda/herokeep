<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Таверна — свій предмет, аркуш (телефон)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Forum&family=Alegreya:ital,wght@0,400;0,600;0,700;1,400;1,700&display=swap">
<style>
body{margin:0}
a{color:#7a5a1e}a:hover{color:#4d3812}
__CSS__
</style>
</helmet>
<div data-theme="tavern" style="position:relative;width:390px;height:844px;overflow:hidden;background:#241710;color:#E9DCBB;font-family:Alegreya,Georgia,serif;font-size:16px;line-height:1.3;display:flex;flex-direction:column;box-sizing:border-box">
  <x-part name="pwood"></x-part>
  <div aria-hidden="true" style="position:relative;display:flex;flex-direction:column;flex:1 1 auto;min-height:0">
    <x-part name="pcombat"></x-part>
  </div>
  <x-part name="pactions"></x-part>
  <x-part name="ptabs" active="bag"></x-part>
  <div class="dim"></div>

  <section class="psheet" role="dialog" aria-modal="true" aria-labelledby="custT" style="height:720px;gap:10px;padding-bottom:0">
    <x-tex kind="paper" style="border-radius:14px 14px 0 0"></x-tex>
    <div class="grip" aria-hidden="true"></div>
    <div style="display:flex;align-items:center;gap:8px"><x-seal state="full" icon="quill" size="34" seed="6"></x-seal><h2 class="leafTitle" id="custT" style="font-size:22px;flex:1 1 auto">Додати свій предмет</h2><button class="ico icoP icoLeaf" type="button" aria-label="Закрити" title="Закрити"><i-icon name="cross-mark" size="14"></i-icon></button></div>
    <div class="fld"><label class="fldL" for="cname" style="font-size:15px">Назва</label><input class="in inErr" id="cname" value="" placeholder="напр. Сигіл Емберфол" aria-invalid="true" aria-describedby="cnameErr" style="height:44px"><span class="err" id="cnameErr" style="font-size:15px"><i-icon name="info" size="13"></i-icon>Введіть назву (до 200 символів).</span></div>
    <div style="display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:end">
      <div class="fld"><label class="fldL" for="ctype" style="font-size:15px">Тип</label><span class="selBox"><select class="selIn" id="ctype" style="height:44px"><option>Спорядження</option><option>Зброя</option><option>Обладунок</option><option>Інструмент</option><option>Витратне</option><option>Магічний предмет</option></select><span class="selChev"><i-icon name="card-pick" size="14"></i-icon></span></span></div>
      <div class="fld"><label class="fldL" for="cw" style="font-size:15px">Вага (фнт.)</label><input class="numIn numInP" id="cw" type="number" value="0.5" min="0" step="0.5" style="width:84px"></div>
    </div>
    <div style="display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center">
      <label class="fldL" for="cq" style="font-size:15px">Кількість</label>
      <span style="display:inline-flex;align-items:center;gap:6px"><button class="stepBtn stepBtnP" type="button" aria-label="На один менше" title="На один менше"><i-icon name="minus" size="14"></i-icon></button><input class="numIn numInP" id="cq" type="number" value="1" min="1" style="width:64px"><button class="stepBtn stepBtnP" type="button" aria-label="На один більше" title="На один більше"><i-icon name="plus" size="14"></i-icon></button></span>
    </div>
    <div class="fld" style="gap:6px">
      <span class="fldL" id="icoL" style="font-size:15px">Іконка</span>
      <div style="display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 8px;border-radius:6px;background:linear-gradient(180deg,#E8CC7C 0%,#C9A24E 45%,#A98335 80%,#8A6A2A 100%);box-shadow:inset 0 1px 0 rgba(255,241,200,.7),inset 0 -1px 0 rgba(70,48,12,.7),0 1px 2px rgba(0,0,0,.55);color:#2B2118"><span class="slotIco" style="width:40px;height:40px"><i-icon name="ring" size="24"></i-icon></span><span style="display:flex;flex-direction:column;gap:2px;min-width:0"><b style="font-size:16px">ring</b><span style="font-size:13px;color:#5E4418">гліф на комірці сумки</span></span><span class="glyph" tabindex="0" aria-describedby="tipIco"><button class="btn btnLeather btnP" type="button" aria-expanded="false" aria-controls="icoPick" style="padding:0 12px"><i-icon name="quill" size="14" style="color:#E8CC7C"></i-icon>Змінити</button><span class="tip" id="tipIco" role="tooltip" style="left:auto;right:0;transform:none;font-size:15px;white-space:normal;width:240px">Обрати гліф або завантажити свій<span class="tipSub">PNG чи SVG; зменшується на пристрої, на сервер не надсилається.</span></span></span></div>
    </div>
    <div class="fld"><label class="fldL" for="cnotes" style="font-size:15px">Нотатки</label><textarea class="ta" id="cnotes" rows="2" style="min-height:58px" placeholder="Що робить, звідки взявся"></textarea></div>
    <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap"><button class="toggle" type="button" aria-pressed="false" style="font-size:16px;min-height:44px"><span class="tgT"><span class="tgK"></span></span><span>Потребує налаштування</span></button><button class="toggle" type="button" aria-pressed="false" style="font-size:16px;min-height:44px"><span class="tgT"><span class="tgK"></span></span><span>Можна спорядити</span></button></div>
    <div class="hk-strap" style="margin:auto -14px 0;border-radius:0;display:flex;align-items:center;gap:8px;padding:8px 12px"><x-tex kind="leather"></x-tex><button class="btn btnGhostL btnP" type="button">Скасувати</button><span style="flex:1 1 auto"></span><span class="hint" style="color:#ECA98F;font-size:14px;display:flex;align-items:center;gap:4px"><i-icon name="info" size="13"></i-icon>потрібна назва</span><button class="btn btnBrass btnP btnOff" type="button" disabled="disabled" aria-disabled="true" title="Спершу введіть назву"><i-icon name="plus" size="16"></i-icon>Додати</button></div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":__PREVIEW__}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
