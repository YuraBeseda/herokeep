<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tavern Table — Play sheet with the Notes drawer (desktop)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Forum&family=Alegreya:ital,wght@0,400;0,600;0,700;1,400;1,700&display=swap">
<style>
body{margin:0}
a{color:#7a5a1e}a:hover{color:#4d3812}
__CSS__
</style>
</helmet>
<div data-theme="tavern" style="position:relative;width:100%;max-width:none;min-height:100vh;height:1000px;overflow:hidden;box-sizing:border-box;background:#241710;color:#E9DCBB;font-family:Alegreya,Georgia,serif;font-size:15px;line-height:1.3;display:flex;flex-direction:column">
  <x-part name="wood"></x-part>
  <x-part name="rail"></x-part>

  <main style="position:relative;z-index:1;display:grid;grid-template-columns:minmax(320px,340fr) minmax(0,560fr) minmax(0,460fr);gap:20px;padding:18px 18px 92px;align-items:start;flex:1 1 auto" aria-hidden="true">
    <x-part name="folio" tab="play" tip="none"></x-part>
    <x-part name="centre"></x-part>
    <x-part name="right"></x-part>
  </main>
  <div class="dim" style="background:rgba(20,10,5,.42);bottom:70px"></div>

  <!-- NOTES drawer -->
  <x-drawer title="Notes" icon="notebook" id="notes" style="top:60px;bottom:70px;width:460px;gap:10px">
    <div style="display:flex;align-items:center;gap:10px"><span class="hint">3 notes · private to you, kept in exports and sync</span><span style="flex:1 1 auto"></span><button class="btn btnBrass" type="button"><i-icon name="plus" size="14"></i-icon>Add note</button></div>

    <!-- note being edited -->
    <div class="nrow nrowOn" style="grid-template-columns:minmax(0,1fr);gap:8px">
      <div style="display:flex;align-items:center;gap:8px"><i-icon name="quill-ink" size="18" style="color:#8A6A2A" hint="Editing"></i-icon><span class="ntitle" style="flex:1 1 auto"><b>Session 7 — the Emberfall vault</b><span class="ndate">Sunday 2 Nov 2026 · 21:50 · editing</span></span></div>
      <div class="fld"><label class="fldL" for="nt">Title</label><input class="in" id="nt" value="Session 7 — the Emberfall vault"></div>
      <div class="fld"><label class="fldL" for="nb">Text <span class="hint">plain text, line breaks kept</span></label><textarea class="ta" id="nb" rows="8" style="min-height:206px">Vault door needs the Emberfall sigil, not a key. Maren says the Cultist leader carries it.
Giant Spiders in the lower stair; poison lasts 3 rounds.
Owed: 50 gp to Bran for the potions.
Ask the DM about the Wand’s dawn recharge — it rolled 1d6+1 last time.</textarea></div>
      <div style="display:flex;align-items:center;gap:8px"><button class="btn btnGhost" type="button" style="color:#8E3220;border-color:#C98C78" title="Asks to confirm first"><i-icon name="trash-can" size="13"></i-icon>Remove note</button><span style="flex:1 1 auto"></span><button class="btn btnGhost" type="button"><i-icon name="cross-mark" size="12"></i-icon>Cancel</button><button class="btn btnBrass" type="button"><i-icon name="save" size="14"></i-icon>Save note</button></div>
    </div>

    <div class="nrow"><span style="display:flex;align-items:center;gap:8px;min-width:0"><i-icon name="scroll-unfurled" size="18" style="color:#8A6A2A"></i-icon><span class="ntitle"><b>Debts and favours</b><span class="ndate">Sunday 26 Oct 2026 · 22:10</span></span></span><span style="display:flex;gap:4px"><button class="ico icoSm icoLeaf" type="button" aria-label="Edit note: Debts and favours" title="Edit"><i-icon name="quill" size="14"></i-icon></button><button class="ico icoSm icoLeaf" type="button" aria-label="Remove note: Debts and favours" title="Remove (asks to confirm)" style="color:#8E3220;box-shadow:inset 0 0 0 1.5px #8E3220"><i-icon name="trash-can" size="14"></i-icon></button></span></div>
    <div class="nrow"><span style="display:flex;align-items:center;gap:8px;min-width:0"><i-icon name="scroll-unfurled" size="18" style="color:#8A6A2A"></i-icon><span class="ntitle"><b>Oath tenets</b><span class="ndate">Saturday 13 Sep 2026 · 19:02</span></span></span><span style="display:flex;gap:4px"><span class="glyph" tabindex="0" aria-describedby="tipEd"><button class="ico icoSm icoLeaf" type="button" aria-label="Edit note: Oath tenets" title="Edit"><i-icon name="quill" size="14"></i-icon></button><span class="tipUp" id="tipEd" role="tooltip">Edit note</span></span><button class="ico icoSm icoLeaf" type="button" aria-label="Remove note: Oath tenets" title="Remove (asks to confirm)" style="color:#8E3220;box-shadow:inset 0 0 0 1.5px #8E3220"><i-icon name="trash-can" size="14"></i-icon></button></span></div>

    <div style="margin-top:auto;display:flex;align-items:center;gap:8px"><i-icon name="info" size="16" style="color:#8A6A2A"></i-icon><span class="hint">Escape or the Notes button closes the drawer; an unsaved note asks first.</span></div>
  </x-drawer>

  <x-part name="strap" active="notes" pos="abs"></x-part>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":__PREVIEW__}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
